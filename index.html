<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务计划 · 简单DDL管理</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap');
    
    :root {
      --primary: #6366f1;
    }
    
    body {
      font-family: 'Inter', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    }
    
    .task-card {
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .task-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.05), 0 4px 6px -4px rgb(0 0 0 / 0.05);
    }
    
    .filter-btn {
      transition: all 0.1s ease;
    }
    
    .filter-btn.active {
      background-color: #6366f1;
      color: white;
      border-color: #6366f1;
    }
    
    .task-row {
      transition: all 0.2s ease;
    }
    
    .overdue {
      border-left: 4px solid #ef4444;
    }
    
    .today {
      border-left: 4px solid #f59e0b;
    }
    
    .future {
      border-left: 4px solid #10b981;
    }
    
    .task-title {
      transition: all 0.2s ease;
    }
    
    .toast {
      animation: slideUp 0.3s ease forwards;
    }
    
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    
    .empty-state {
      background: linear-gradient(145deg, #f8fafc 0%, #f1f5f9 100%);
    }
    
    /* 桌面悬浮窗专用样式 */
    #drag-bar {
      -webkit-app-region: drag;
      user-select: none;
      -webkit-user-select: none;
    }
    
    .window-btn {
      -webkit-app-region: no-drag;
      transition: all 0.1s ease;
    }
    
    .window-btn:hover {
      background-color: #e2e8f0;
    }
    
    .window-btn.close:hover {
      background-color: #ef4444;
      color: white;
    }
    
    /* 更紧凑的桌面悬浮窗样式 */
    .desktop-compact .max-w-3xl {
      max-width: 100%;
    }
    
    /* 额外紧凑覆盖 */
    .task-card {
      font-size: 13px;
    }
    input[type="date"] {
      font-size: 12px;
    }
  </style>
</head>
<body class="bg-slate-50 overflow-hidden" style="height: 100vh; display: flex; flex-direction: column;">
  <!-- 桌面悬浮窗拖拽标题栏 -->
  <div id="drag-bar" class="pywebview-drag-region flex items-center justify-between px-2.5 text-xs bg-slate-100 border-b border-slate-200" style="height: 24px; flex-shrink: 0;">
    <div class="flex items-center gap-x-1.5 text-slate-600 font-medium select-none">
      <i class="fa-solid fa-list-check text-indigo-500"></i>
      <span class="text-[12px] font-semibold tracking-tight">任务计划</span>
    </div>
    
    <div class="flex items-center -mr-1 gap-x-0.5">
      <!-- 置顶按钮 -->
      <button id="pin-btn" onclick="togglePin()" 
              class="window-btn w-6 h-6 flex items-center justify-center text-slate-500 hover:text-indigo-600 rounded text-xs" 
              title="置顶 / 取消置顶">
        <i class="fa-solid fa-thumbtack"></i>
      </button>
      
      <!-- 最小化 -->
      <button onclick="minimizeWin()" 
              class="window-btn w-6 h-6 flex items-center justify-center text-slate-500 hover:text-slate-700 rounded text-lg leading-none font-light" 
              title="最小化">
        −
      </button>
      
      <!-- 关闭 -->
      <button onclick="closeWin()" 
              class="window-btn close w-6 h-6 flex items-center justify-center text-slate-500 hover:text-white rounded text-base font-medium" 
              title="关闭">
        ×
      </button>
    </div>
  </div>

  <!-- 主内容区（紧凑版，可滚动） -->
  <div class="max-w-3xl mx-auto px-2.5 pt-1.5 pb-3 desktop-compact flex-1 overflow-auto" style="min-height: 0;">
    <!-- 顶部操作（清空） -->
    <div class="flex justify-end mb-2">
      <button onclick="clearCompleted()" 
              class="px-2 py-0.5 text-[10px] text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-md flex items-center gap-x-1 transition-colors">
        <i class="fa-solid fa-trash-can fa-xs"></i>
        <span>清空已完成</span>
      </button>
    </div>

    <!-- Add / Edit Form -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-3 mb-3">
      <div class="flex items-center gap-x-1.5 mb-2">
        <i class="fa-solid fa-plus-circle text-indigo-600 text-sm"></i>
        <h2 id="form-title" class="font-semibold text-sm text-slate-700">新建任务</h2>
      </div>
      
      <div class="space-y-2">
        <!-- Title -->
        <div>
          <input id="task-title" type="text" 
                 class="w-full px-3 py-1.5 border border-slate-200 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200 rounded-xl text-sm placeholder:text-slate-400 outline-none"
                 placeholder="输入任务内容...">
        </div>
        
        <div class="flex gap-2 items-end">
          <!-- Deadline -->
          <div class="flex-1 min-w-0">
            <label class="block text-[10px] font-medium text-slate-500 mb-0.5 px-0.5">DDL</label>
            <input id="task-deadline" type="date" 
                   class="w-full px-2 py-1.5 border border-slate-200 focus:border-indigo-400 focus:ring-1 focus:ring-indigo-200 rounded-lg text-xs outline-none text-slate-700">
          </div>
          
          <!-- Recurring -->
          <div>
            <label class="block text-[10px] font-medium text-slate-500 mb-0.5 px-0.5">重复</label>
            <label class="flex items-center gap-x-1.5 px-2 py-1.5 border border-slate-200 rounded-lg cursor-pointer hover:bg-slate-50 transition-colors text-xs">
              <input id="task-recurring" type="checkbox" class="w-3.5 h-3.5 text-indigo-600 border-slate-300 rounded focus:ring-indigo-200">
              <span class="text-slate-600 font-medium flex items-center gap-x-1">
                <i class="fa-solid fa-redo text-[10px]"></i>
                <span>每日</span>
              </span>
            </label>
          </div>
          
          <!-- Action Buttons -->
          <div class="flex items-center gap-x-1 shrink-0">
            <button id="submit-btn"
                    onclick="handleSubmit()"
                    class="px-4 py-1.5 bg-indigo-600 hover:bg-indigo-700 transition-colors text-white font-medium rounded-lg flex items-center justify-center gap-x-1 text-xs shadow-sm">
              <i class="fa-solid fa-plus fa-xs"></i>
              <span>添加</span>
            </button>
            <button onclick="cancelEdit()"
                    id="cancel-btn"
                    class="hidden px-3 py-1.5 text-slate-500 hover:bg-slate-100 transition-colors font-medium rounded-lg border border-slate-200 text-xs">
              取消
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Stats & Filters -->
    <div class="mb-1.5 flex items-center justify-between">
      <div class="flex items-center gap-x-2">
        <h2 class="font-semibold text-sm text-slate-700">我的任务</h2>
        <span id="active-count" 
              class="px-1.5 py-0 text-[10px] bg-slate-200 text-slate-600 font-medium rounded-full">0</span>
      </div>
      
      <!-- Search -->
      <div class="relative w-40">
        <i class="fa-solid fa-search absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
        <input id="search-input" type="text" placeholder="搜索..." 
               oninput="renderTasks()"
               class="w-full pl-7 pr-2 py-1 bg-white border border-slate-200 focus:border-indigo-300 rounded-lg text-xs outline-none">
      </div>
    </div>

    <!-- Filter Pills -->
    <div class="flex flex-wrap gap-1 mb-3" id="filters">
      <button onclick="setFilter('all')" id="filter-all"
              class="filter-btn active px-2.5 py-0.5 text-xs font-medium border border-slate-200 bg-white hover:bg-slate-100 rounded-lg flex items-center gap-x-1">
        <span>全部</span>
      </button>
      <button onclick="setFilter('today')" id="filter-today"
              class="filter-btn px-2.5 py-0.5 text-xs font-medium border border-slate-200 bg-white hover:bg-slate-100 rounded-lg flex items-center gap-x-1">
        <i class="fa-solid fa-calendar-day text-amber-500 text-[10px]"></i>
        <span>今日</span>
      </button>
      <button onclick="setFilter('overdue')" id="filter-overdue"
              class="filter-btn px-2.5 py-0.5 text-xs font-medium border border-slate-200 bg-white hover:bg-slate-100 rounded-lg flex items-center gap-x-1">
        <i class="fa-solid fa-exclamation-circle text-red-500 text-[10px]"></i>
        <span>逾期</span>
      </button>
      <button onclick="setFilter('recurring')" id="filter-recurring"
              class="filter-btn px-2.5 py-0.5 text-xs font-medium border border-slate-200 bg-white hover:bg-slate-100 rounded-lg flex items-center gap-x-1">
        <i class="fa-solid fa-redo text-purple-500 text-[10px]"></i>
        <span>每日</span>
      </button>
    </div>

    <!-- Active Tasks -->
    <div id="tasks-container" class="space-y-1 mb-3">
      <!-- Populated by JS -->
    </div>

    <!-- Empty State for active -->
    <div id="empty-active" class="hidden empty-state border border-slate-200 rounded-2xl p-4 text-center mb-4">
      <i class="fa-solid fa-inbox text-2xl text-slate-300 mb-1"></i>
      <p class="text-xs text-slate-500">没有符合条件的任务</p>
    </div>

    <!-- Completed Section -->
    <div id="completed-section" class="hidden">
      <div class="flex items-center justify-between mb-1.5 px-0.5">
        <div class="flex items-center gap-x-1.5">
          <i class="fa-solid fa-check-circle text-emerald-600 text-sm"></i>
          <h3 class="font-semibold text-xs text-slate-600">已完成</h3>
          <span id="completed-count" class="text-[10px] px-1.5 py-px bg-emerald-100 text-emerald-700 rounded-full font-medium">0</span>
        </div>
        <button onclick="clearCompleted()" 
                class="text-[10px] text-emerald-600 hover:text-emerald-700 flex items-center gap-x-0.5 px-1.5 py-0.5 hover:bg-emerald-50 rounded">
          <i class="fa-solid fa-times text-[10px]"></i>
          <span>清空</span>
        </button>
      </div>
      
      <div id="completed-container" class="space-y-1">
        <!-- Populated by JS -->
      </div>
    </div>

    <!-- Footer hint -->
    <div class="mt-1.5 text-center">
      <p class="text-[9px] text-slate-400">
        本地保存 · 拖动顶部移动
      </p>
    </div>
  </div>

  <!-- Toast container -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 space-y-2"></div>

  <script>
    // Tailwind script
    function initTailwind() {
      document.documentElement.style.setProperty('--accent', '#6366f1');
    }

    // Data
    let tasks = [];
    let currentFilter = 'all';
    let editingId = null;

    const STORAGE_KEY = 'task-planner-tasks';

    // 使用本地 JSON 文件存储（比 localStorage 更可靠）
    async function loadTasks() {
      // 桌面版（pywebview）：优先使用 Python 提供的文件存储
      if (window.pywebview && window.pywebview.api && window.pywebview.api.load_tasks) {
        try {
          let data = await window.pywebview.api.load_tasks();

          // 迁移：如果文件里没有数据，但 localStorage 有，则迁移一次
          if (!data || !Array.isArray(data) || data.length === 0) {
            const local = localStorage.getItem(STORAGE_KEY);
            if (local) {
              try {
                const parsed = JSON.parse(local);
                if (Array.isArray(parsed) && parsed.length > 0) {
                  data = parsed;
                  await window.pywebview.api.save_tasks(data);
                  localStorage.removeItem(STORAGE_KEY); // 清理旧数据
                }
              } catch (e) {}
            }
          }

          if (data && Array.isArray(data) && data.length > 0) {
            tasks = data;
            return;
          }

          // 首次使用：生成示例任务
          const today = new Date();
          tasks = [
            {
              id: generateId(),
              title: '写周报',
              deadline: today.toISOString().split('T')[0],
              recurring: false,
              completed: false
            },
            {
              id: generateId(),
              title: '喝水 2000ml',
              deadline: today.toISOString().split('T')[0],
              recurring: true,
              completed: false
            }
          ];
          await window.pywebview.api.save_tasks(tasks);
          return;
        } catch (e) {
          console.warn('从文件加载任务失败，使用内存', e);
        }
      }

      // 浏览器回退（直接在浏览器打开 index.html 时使用）
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          tasks = JSON.parse(saved);
        } catch (e) {
          tasks = [];
        }
      } else {
        // First time sample tasks (浏览器模式)
        const today = new Date();
        tasks = [
          {
            id: generateId(),
            title: '写周报',
            deadline: today.toISOString().split('T')[0],
            recurring: false,
            completed: false
          },
          {
            id: generateId(),
            title: '喝水 2000ml',
            deadline: today.toISOString().split('T')[0],
            recurring: true,
            completed: false
          }
        ];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
      }
    }

    function saveTasks() {
      // 桌面版：保存到本地 JSON 文件
      if (window.pywebview && window.pywebview.api && window.pywebview.api.save_tasks) {
        window.pywebview.api.save_tasks(tasks).catch(err => {
          console.warn('保存到文件失败', err);
        });
        return;
      }

      // 浏览器回退
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function generateId() {
      return 't_' + Date.now().toString(36) + Math.random().toString(36).slice(2);
    }

    function getTodayStr() {
      const d = new Date();
      return d.toISOString().split('T')[0];
    }

    function getTomorrowStr() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return d.toISOString().split('T')[0];
    }

    function formatDate(dateStr) {
      const d = new Date(dateStr + 'T00:00:00');
      const month = d.getMonth() + 1;
      const day = d.getDate();
      return `${month}月${day}日`;
    }

    function getRelativeLabel(task) {
      const todayStr = getTodayStr();
      const today = dateStrToDate(todayStr);
      const due = dateStrToDate(task.deadline);

      if (task.deadline < todayStr) {
        const diff = Math.floor((today - due) / (1000 * 60 * 60 * 24));
        return { text: `逾期${diff}天`, color: 'text-red-600 bg-red-100' };
      } else if (task.deadline === todayStr) {
        return { text: '今日到期', color: 'text-amber-600 bg-amber-100' };
      } else {
        const diff = Math.floor((due - today) / (1000 * 60 * 60 * 24));
        return { text: `${diff}天后`, color: 'text-emerald-600 bg-emerald-100' };
      }
    }

    // 安全日期解析（避免时区问题）
    function dateStrToDate(str) {
      const [y, m, d] = str.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function setFilter(filter) {
      currentFilter = filter;
      
      // Update button styles
      document.querySelectorAll('#filters button').forEach(btn => {
        btn.classList.remove('active');
        btn.classList.add('bg-white', 'border-slate-200');
      });
      
      const activeBtn = document.getElementById(`filter-${filter}`);
      if (activeBtn) {
        activeBtn.classList.add('active');
        activeBtn.classList.remove('bg-white', 'border-slate-200');
      } else {
        // fallback for "all"
        document.getElementById('filter-all').classList.add('active');
      }
      
      renderTasks();
    }

    function getFilteredActiveTasks(searchTerm = '') {
      const today = getTodayStr();
      let filtered = tasks.filter(t => !t.completed);

      // Apply search
      if (searchTerm) {
        const q = searchTerm.toLowerCase();
        filtered = filtered.filter(t => t.title.toLowerCase().includes(q));
      }

      // Apply filter
      if (currentFilter === 'today') {
        filtered = filtered.filter(t => t.deadline === today);
      } else if (currentFilter === 'overdue') {
        filtered = filtered.filter(t => t.deadline < today);
      } else if (currentFilter === 'recurring') {
        filtered = filtered.filter(t => t.recurring);
      }

      // Sort by deadline asc
      filtered.sort((a, b) => a.deadline.localeCompare(b.deadline));
      
      return filtered;
    }

    function getCompletedTasks() {
      return tasks.filter(t => t.completed).sort((a, b) => b.deadline.localeCompare(a.deadline));
    }

    function renderTasks() {
      const container = document.getElementById('tasks-container');
      const emptyEl = document.getElementById('empty-active');
      const searchInput = document.getElementById('search-input');
      const searchTerm = searchInput ? searchInput.value.trim() : '';
      
      const filtered = getFilteredActiveTasks(searchTerm);
      const activeCountEl = document.getElementById('active-count');
      
      activeCountEl.textContent = filtered.length;

      container.innerHTML = '';

      if (filtered.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      } else {
        emptyEl.classList.add('hidden');
      }

      filtered.forEach(task => {
        const isToday = task.deadline === getTodayStr();
        const isOver = task.deadline < getTodayStr();
        
        const rel = getRelativeLabel(task);
        
        // 完成按钮文案
        let completeText = task.recurring ? '完成今日' : '完成';
        if (task.recurring && isOver) {
          completeText = '补做';
        }
        
        const card = document.createElement('div');
        card.className = `task-card bg-white border border-slate-200 rounded-xl px-2.5 py-1.5 flex items-center gap-x-2 task-row ${isOver ? 'overdue' : isToday ? 'today' : 'future'}`;
        
        card.innerHTML = `
          <div class="flex-1 min-w-0">
            <div class="flex items-center gap-x-1.5">
              <span class="task-title font-medium text-sm text-slate-800 break-words ${isOver ? 'text-red-700' : ''}">
                ${escapeHtml(task.title)}
              </span>
              ${task.recurring ? `
                <span class="inline-flex items-center gap-0.5 px-1.5 py-px rounded-md text-[10px] font-medium bg-purple-100 text-purple-700">
                  <i class="fa-solid fa-redo fa-xs"></i>
                  <span>每日</span>
                </span>` : ''}
            </div>
            
            <div class="mt-0.5 flex items-center gap-x-1 text-xs">
              <span class="text-slate-500">${formatDate(task.deadline)}</span>
              <span class="text-[10px] px-1.5 py-px rounded ${rel.color} font-medium">
                ${rel.text}
              </span>
            </div>
          </div>
          
          <div class="flex items-center gap-x-0.5 shrink-0">
            <button onclick="completeTask('${task.id}')"
                    class="px-2.5 py-0.5 text-xs font-semibold transition-all rounded-lg flex items-center gap-x-1
                           ${task.recurring 
                              ? 'bg-purple-600 hover:bg-purple-700 text-white' 
                              : 'bg-emerald-600 hover:bg-emerald-700 text-white'}">
              <i class="fa-solid fa-check fa-xs"></i>
              <span>${completeText}</span>
            </button>
            
            <button onclick="editTask('${task.id}')"
                    class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-colors text-xs">
              <i class="fa-solid fa-pen"></i>
            </button>
            
            <button onclick="deleteTask('${task.id}')"
                    class="w-6 h-6 flex items-center justify-center text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors text-xs">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
        `;
        
        container.appendChild(card);
      });
      
      // Render completed section
      renderCompleted();
    }

    function renderCompleted() {
      const container = document.getElementById('completed-container');
      const section = document.getElementById('completed-section');
      const countEl = document.getElementById('completed-count');
      
      const completed = getCompletedTasks();
      
      countEl.textContent = completed.length;
      
      if (completed.length === 0) {
        section.classList.add('hidden');
        return;
      }
      
      section.classList.remove('hidden');
      container.innerHTML = '';
      
      completed.forEach(task => {
        const row = document.createElement('div');
        row.className = 'bg-white border border-slate-200 rounded-xl px-2.5 py-1 flex items-center text-xs gap-x-2';
        
        row.innerHTML = `
          <div class="flex-1 flex items-center gap-x-1.5 min-w-0">
            <i class="fa-solid fa-check text-emerald-500 fa-xs"></i>
            <span class="line-through text-slate-400">${escapeHtml(task.title)}</span>
            <span class="ml-auto text-[10px] text-slate-400">${formatDate(task.deadline)}</span>
          </div>
          <div class="flex gap-x-1">
            <button onclick="restoreTask('${task.id}')"
                    class="px-2 py-0.5 text-[10px] rounded-md border text-emerald-600 border-emerald-200 hover:bg-emerald-50 transition-colors">
              恢复
            </button>
            <button onclick="deleteTask('${task.id}')"
                    class="px-1.5 py-0.5 text-[10px] rounded-md text-slate-400 hover:text-red-500 hover:bg-red-50 transition-colors">
              <i class="fa-solid fa-trash fa-xs"></i>
            </button>
          </div>
        `;
        
        container.appendChild(row);
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function completeTask(id) {
      const idx = tasks.findIndex(t => t.id === id);
      if (idx === -1) return;
      
      const task = tasks[idx];
      
      if (task.recurring) {
        // “完成今日”逻辑：
        // - 点击一次即完成“今天”的那一次实例
        // - 无论原来是今天还是逾期，都直接设置到明天
        const wasOverdue = task.deadline < getTodayStr();
        task.deadline = getTomorrowStr();
        showToast(wasOverdue ? '已补做今日，DDL 更新为明天' : '今日已完成，DDL 已更新为明天', 'success');
      } else {
        task.completed = true;
        showToast('任务已完成', 'success');
      }
      
      saveTasks();
      renderTasks();
    }

    function restoreTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      
      task.completed = false;
      saveTasks();
      renderTasks();
    }

    function deleteTask(id) {
      if (!confirm('确定要删除这个任务吗？')) return;
      
      tasks = tasks.filter(t => t.id !== id);
      saveTasks();
      renderTasks();
    }

    function editTask(id) {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      
      editingId = id;
      
      // Populate form
      document.getElementById('task-title').value = task.title;
      document.getElementById('task-deadline').value = task.deadline;
      document.getElementById('task-recurring').checked = task.recurring;
      
      // Update UI for editing mode
      document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-edit text-indigo-600 mr-2"></i>编辑任务';
      document.getElementById('submit-btn').innerHTML = `
        <i class="fa-solid fa-save"></i>
        <span>保存修改</span>
      `;
      document.getElementById('cancel-btn').classList.remove('hidden');
      
      // Scroll to form
      document.getElementById('task-title').focus();
      document.getElementById('task-title').select();
    }

    function cancelEdit() {
      editingId = null;
      
      // Reset form
      document.getElementById('task-title').value = '';
      document.getElementById('task-deadline').value = '';
      document.getElementById('task-recurring').checked = false;
      
      // Reset UI
      document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-plus-circle text-indigo-600 mr-1"></i>新建任务';
      document.getElementById('submit-btn').innerHTML = `
        <i class="fa-solid fa-plus"></i>
        <span>添加</span>
      `;
      document.getElementById('cancel-btn').classList.add('hidden');
    }

    function handleSubmit() {
      const titleInput = document.getElementById('task-title');
      const deadlineInput = document.getElementById('task-deadline');
      const recurringInput = document.getElementById('task-recurring');
      
      const title = titleInput.value.trim();
      const deadline = deadlineInput.value;
      const recurring = recurringInput.checked;
      
      if (!title) {
        alert('请输入任务名称');
        titleInput.focus();
        return;
      }
      
      if (!deadline) {
        alert('请选择截止日期');
        deadlineInput.focus();
        return;
      }
      
      if (editingId) {
        // Update
        const task = tasks.find(t => t.id === editingId);
        if (task) {
          task.title = title;
          task.deadline = deadline;
          task.recurring = recurring;
          // If it was completed and user edits, keep completed (rare case)
        }
        editingId = null;
        showToast('任务已更新', 'success');
      } else {
        // Create new
        const newTask = {
          id: generateId(),
          title,
          deadline,
          recurring,
          completed: false
        };
        tasks.push(newTask);
        showToast('任务已添加', 'success');
      }
      
      saveTasks();
      
      // Reset form
      titleInput.value = '';
      deadlineInput.value = '';
      recurringInput.checked = false;
      
      // Reset form labels
      document.getElementById('form-title').innerHTML = '<i class="fa-solid fa-plus-circle text-indigo-600 mr-1"></i>新建任务';
      document.getElementById('submit-btn').innerHTML = `
        <i class="fa-solid fa-plus"></i>
        <span>添加</span>
      `;
      document.getElementById('cancel-btn').classList.add('hidden');
      
      // Refresh list (reset filter to show new item)
      if (currentFilter !== 'all') {
        setFilter('all');
      } else {
        renderTasks();
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      
      const toast = document.createElement('div');
      toast.className = `toast flex items-center gap-x-3 px-4 py-3 rounded-2xl shadow-lg text-sm font-medium border
        ${type === 'success' 
          ? 'bg-white border-emerald-200 text-emerald-700' 
          : 'bg-white border-red-200 text-red-600'}`;
      
      toast.innerHTML = `
        <i class="fa-solid ${type === 'success' ? 'fa-check-circle text-emerald-500' : 'fa-exclamation-circle text-red-500'}"></i>
        <span>${message}</span>
      `;
      
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.transition = 'all 0.25s ease';
        toast.style.opacity = '0';
        setTimeout(() => toast.remove(), 200);
      }, 2400);
    }

    function clearCompleted() {
      const completedCount = tasks.filter(t => t.completed).length;
      if (completedCount === 0) return;
      
      if (!confirm(`确定要清空全部 ${completedCount} 个已完成任务吗？`)) return;
      
      tasks = tasks.filter(t => !t.completed);
      saveTasks();
      renderTasks();
    }

    function initFilters() {
      // Make sure "all" filter is active on load
      const allBtn = document.getElementById('filter-all');
      allBtn.classList.add('active');
      
      // Keyboard support: press / to focus search
      document.addEventListener('keydown', (e) => {
        if (e.key === '/' && document.activeElement.tagName === 'BODY') {
          e.preventDefault();
          document.getElementById('search-input').focus();
        }
        
        // ESC cancels edit
        if (e.key === 'Escape' && editingId) {
          cancelEdit();
        }
      });
      
      // Optional: allow Enter in search to do nothing special
    }

    function initDateDefault() {
      // Default the date picker to today
      const dateInput = document.getElementById('task-deadline');
      const today = getTodayStr();
      
      // Only set if empty
      if (!dateInput.value) {
        dateInput.value = today;
      }
      
      // Also allow pressing Enter in title to submit
      const titleInput = document.getElementById('task-title');
      titleInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
          handleSubmit();
        }
      });
    }

    async function init() {
      initTailwind();
      await loadTasks();
      initFilters();
      initDateDefault();
      
      // Initial render
      renderTasks();
      
      // Make search also trigger on focus clear sometimes
      const search = document.getElementById('search-input');
      search.addEventListener('focus', () => {
        // Optional future enhancement
      });
      
      // Bonus: if user wants to start typing task immediately
      // document.getElementById('task-title').focus();
      
      // Dev helper: expose tasks in console
      window.__tasks = tasks;

      // 桌面版：初始化置顶按钮状态（默认置顶）
      initDesktopControls();
    }

    // ==================== 桌面悬浮窗控制 ====================
    function initDesktopControls() {
      // 设置初始置顶图标状态
      const pinBtn = document.getElementById('pin-btn');
      if (pinBtn) {
        const icon = pinBtn.querySelector('i');
        // 默认是置顶状态
        icon.classList.add('text-indigo-600');
        pinBtn.title = '取消置顶';
      }
    }

    function closeWin() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.close_window();
      } else {
        // 浏览器 fallback
        window.close();
      }
    }

    function minimizeWin() {
      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.minimize_window();
      }
    }

    function togglePin() {
      const pinBtn = document.getElementById('pin-btn');
      if (!pinBtn) return;

      if (window.pywebview && window.pywebview.api) {
        window.pywebview.api.toggle_on_top().then(isOnTop => {
          const icon = pinBtn.querySelector('i');
          if (isOnTop) {
            icon.classList.add('text-indigo-600');
            pinBtn.title = '取消置顶';
          } else {
            icon.classList.remove('text-indigo-600');
            pinBtn.title = '置顶';
          }
        });
      } else {
        // 浏览器模式下模拟提示
        alert('浏览器模式不支持置顶功能。请使用桌面版 (python app.py)');
      }
    }

    // Boot - properly wait for pywebview API (important for initial data load)
    function startApp() {
      // Call async init
      init();
    }

    // Use pywebviewready event for reliable API access on startup
    if (window.pywebview && window.pywebview.api) {
      // Already ready (rare)
      startApp();
    } else {
      window.addEventListener('pywebviewready', startApp);
    }

    // Fallback for browser testing (no pywebview) or if event missed
    window.addEventListener('load', function() {
      // Only if no pywebview API detected yet
      setTimeout(function() {
        if (!window.pywebview || !window.pywebview.api) {
          startApp();
        }
      }, 50);
    });
  </script>
</body>
</html>
